<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de redes de proyectos · PERT · CPM · ROY</title>
  <meta name="description" content="Laboratorio interactivo y bilingüe para enseñar redes de proyectos: ROY (actividad en nodo), tiempos, holguras y camino crítico, paso a paso. Interactive bilingual lab for teaching project networks.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="app.skip">Saltar al contenido</a>
  <header class="site-head">
    <a class="brand" id="brandLink" href="index.html">
      <h1 class="brand-name" data-i18n="app.title">Laboratorio de redes de proyectos</h1>
      <span data-i18n="app.subtitle">PERT · CPM · ROY</span>
    </a>
    <nav class="tabs" data-i18n-label="nav.label" aria-label="Secciones">
      <a href="#" id="navM0" data-i18n="nav.m0">Del enunciado a la tabla</a>
      <a href="#" id="navRoute" data-i18n="nav.route">Ruta guiada</a>
      <a href="#" id="navWork" data-i18n="nav.work">Taller</a>
      <a href="#" id="navUnc" data-i18n="nav.unc">Duraciones inciertas</a>
      <a href="#" id="navEx" data-i18n="nav.ex">Ejercicios</a>
    </nav>
    <details class="settings" id="settings">
      <summary id="settingsBtn"><svg class="gear" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span data-i18n="ctl.settings">Ajustes</span><span class="chev" aria-hidden="true">▾</span></summary>
      <div class="controls" id="settingsPanel">
        <label><span data-i18n="ctl.lang">Idioma</span>
          <select id="selLang"><option value="es">ES</option><option value="en">EN</option></select></label>
        <label><span data-i18n="ctl.nota">Notación</span>
          <select id="selNota"><option value="en" data-i18n="ctl.notaEn">ES · EF · LS · LF</option><option value="es" data-i18n="ctl.notaEs">tᵢ · fᵢ · tᵢ* · fᵢ*</option></select></label>
        <label><span data-i18n="ctl.box">Caja</span>
          <select id="selBox"><option value="7" data-i18n="ctl.box7">7 campos</option><option value="4" data-i18n="ctl.box4">4 campos</option><option value="c" data-i18n="ctl.boxc">Compacta</option></select></label>
      </div>
    </details>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p>Esta herramienta necesita JavaScript para funcionar. · This tool needs JavaScript to work.</p></noscript>
    <p id="urlWarning" class="banner" role="status" hidden></p>
    <p id="urlTooLong" class="banner" role="status" data-i18n="app.urlTooLong" hidden></p>

    <section id="m0View" class="m0" data-i18n-label="m0.region" aria-label="Del enunciado a la tabla" hidden></section>

    <section id="exView" class="ex" data-i18n-label="ex.region" aria-label="Ejercicios" hidden></section>

    <section id="mqView" class="mq" hidden></section>

    <section id="uncView" class="unc" data-i18n-label="unc.region" aria-label="Duraciones inciertas" hidden></section>

    <section id="workshop" class="card workshop" hidden></section>

    <div id="stage" class="stage">
      <section class="card panel-main" id="panelMain">
        <div class="panel-head">
          <div class="row-wrap">
            <div class="seg" role="group" id="graphGroup" data-i18n-label="view.graphLabel" aria-label="Tipo de red">
              <button type="button" id="btnAon" data-i18n="view.graphAon">Red ROY</button>
              <button type="button" id="btnAoa" data-i18n="view.graphAoa">Red PERT</button>
            </div>
            <div class="seg" role="group" id="viewGroup" data-i18n-label="view.label" aria-label="Vista">
              <button type="button" id="btnNet" data-i18n="view.net">Red</button>
              <button type="button" id="btnMatrix" data-i18n="view.matrix">Matriz</button>
              <button type="button" id="btnSide" data-i18n="view.side" hidden>Lado a lado</button>
              <button type="button" id="btnCmp" data-i18n="view.cmp" hidden>Comparar métodos</button>
              <button type="button" id="btnReto" data-i18n="view.reto" hidden>Reto de ficticias</button>
            </div>
          </div>
          <span id="unitLine" class="muted"></span>
          <p id="methodLine" class="method-line small" hidden></p>
        </div>
        <div id="netView" class="scroll-box" tabindex="0" role="region" data-i18n-label="view.net" aria-label="Red"></div>
        <div id="cmpView" class="cmp" role="region" data-i18n-label="cmp.region" aria-label="Comparador de métodos" hidden></div>
        <div id="retoView" class="reto" role="region" data-i18n-label="reto.region" aria-label="Reto de ficticias" hidden></div>
        <p id="retoLive" class="sr-only" role="status"></p>
        <div id="selInfo" class="sel-info" role="region" data-i18n-label="sel.label" aria-label="Selección" hidden></div>
        <div id="matrixView" class="scroll-box" tabindex="0" role="region" data-i18n-label="view.matrix" aria-label="Matriz" hidden></div>
        <p class="muted small"><span id="boxHint"></span> <button type="button" class="linklike" id="btnTable" aria-controls="altTable" aria-expanded="false"></button></p>
        <div id="altTable" class="scroll-box" tabindex="0" hidden></div>
        <div id="resultsView" hidden></div>
        <div id="ganttView" class="scroll-box" tabindex="0" role="region" data-i18n-label="steps.gantt" aria-label="Diagrama de Gantt" hidden></div>
      </section>

      <aside class="side" id="side">
        <div id="dummyCounter" class="card counter" role="region" data-i18n-label="count.region" aria-label="Contador de ficticias" hidden></div>
        <div class="card narration">
          <div class="step-head">
            <span id="stepTitle" class="eyebrow"></span>
            <button type="button" class="learn-btn" id="btnLearn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg><span class="lbl" data-i18n="learn.button">Aprende más</span></button>
          </div>
          <p id="stepText"></p>
          <div id="formula" class="formula"></div>
          <div id="predictBox" class="predict" hidden></div>
          <div class="row-wrap">
            <label class="check"><input type="checkbox" id="chkPredict"> <span data-i18n="predict.toggle">Modo predicción</span></label>
            <button type="button" class="ghost push" id="btnWhatIf" aria-expanded="false" aria-controls="whatIfBox" data-i18n="whatif.button">¿Y si…?</button>
          </div>
          <div id="whatIfBox" class="whatif" hidden></div>
        </div>
        <div class="card player">
          <div class="player-line muted small"><span id="stepCounter"></span><span id="phaseCounter"></span></div>
          <div class="bar"><div id="barFill"></div></div>
          <div class="player-buttons">
            <button type="button" id="btnFirst" data-i18n-label="player.first" aria-label="Inicio">⏮</button>
            <button type="button" id="btnPrev" data-i18n-label="player.prev" aria-label="Anterior">←</button>
            <button type="button" id="btnPlay" class="primary" data-i18n-label="player.play" aria-label="Reproducir">▶</button>
            <button type="button" id="btnNext" data-i18n-label="player.next" aria-label="Siguiente">→</button>
          </div>
          <span class="muted small center" data-i18n="player.keys">← → avanzar o retroceder · Espacio reproducir · Inicio volver</span>
        </div>
        <div class="legend muted small" id="legend"></div>
      </aside>
    </div>

    <p id="live" class="sr-only" aria-live="polite"></p>
  </main>

  <dialog id="learnDialog" aria-labelledby="learnTitle">
    <div class="dialog-head"><h2 id="learnTitle"></h2><button type="button" class="ghost" id="btnLearnClose" data-i18n="learn.close">Cerrar</button></div>
    <div id="learnBody"></div>
  </dialog>

  <script src="js/store.js"></script>

  <script src="js/app.js"></script>
</body>
