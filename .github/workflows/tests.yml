name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis y pruebas
        run: npm test
      - name: Cobertura del núcleo (≥ 90 % de líneas en js/core/)
        run: npm run coverage
  lint:
    # Tier 2 (principio 3): ESLint solo se instala aquí, nunca en package.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar ESLint sin tocar package.json
        run: npm install --no-save --no-package-lock eslint@9.39.5 @eslint/js@9.39.5 globals@17.14.0
      - name: ESLint (reglas recomendadas)
        run: npx eslint .
  browser:
    # Tier 2 (principio 3): Playwright y axe-core solo se instalan aquí, nunca en package.json.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y axe-core sin tocar package.json
        run: npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.10.2
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador (ruta, URL, matriz, teclado, axe y presupuesto de 1 MB)
        run: node tests/browser/run.js
        env:
          CI: true
