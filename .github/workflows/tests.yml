name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxis y pruebas
        run: npm test
      - name: Cobertura del núcleo (≥ 90 % de líneas en js/core/)
        run: npm run coverage
